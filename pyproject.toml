[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baldanders"
version = "0.1.0"
description = "Local PII firewall for cloud LLMs — scrubs personal data before it leaves your machine"
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "rich>=13.0",
    "httpx>=0.27",
    "onnxruntime>=1.17",
    "tokenizers>=0.19",
    "gliner>=0.2.29",
]

[project.scripts]
baldanders = "baldanders.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baldanders"]
